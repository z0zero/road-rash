name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build and smoke test
    runs-on: ubuntu-latest
    # The smoke test alone takes 7 to 18 minutes, depending on the runner.
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

      - name: Keep the smoke test's traces when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
